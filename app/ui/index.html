<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Pennywise</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mode="start">
  <!-- Toolbar: normal mode (solid) and focus mode (hover overlay) -->
  <header class="bar" id="bar">
    <div class="traffic-spacer"></div>

    <div class="group nav-only">
      <button class="icon" id="back" title="Back (⌘[)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="icon" id="forward" title="Forward (⌘])"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
      <button class="icon" id="reload" title="Reload (⌘R)">
        <svg class="i-reload" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        <svg class="i-stop" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <form class="address nav-only" id="address-form" autocomplete="off">
      <span class="site-dot" id="site-dot"></span>
      <input id="address" type="text" spellcheck="false" placeholder="Search or enter address">
      <div class="progress" id="progress"></div>
    </form>

    <div class="title focus-only" id="title"></div>

    <div class="opacity-inline" id="opacity-inline">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16" /><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
      <input type="range" id="opacity" min="20" max="100" step="1">
      <span id="opacity-val">100%</span>
    </div>

    <div class="group right">
      <button class="pill" id="chat" title="Show / hide chat (⇧⌘K)">
        <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
        <span>Chat</span>
      </button>
      <button class="pill accent" id="focus" title="Focus mode: just the video (⇧⌘F)">
        <svg class="i-enter" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        <svg class="i-exit" viewBox="0 0 24 24"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>
        <span class="l-enter">Focus</span><span class="l-exit">Browser</span>
      </button>
      <button class="icon" id="opacity-btn" title="Opacity (⇧⌘↑ / ⇧⌘↓)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" class="fill"/></svg>
      </button>
      <button class="icon" id="pin" title="Float on top (⇧⌘P)">
        <svg viewBox="0 0 24 24"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><path d="M12 15v6"/></svg>
      </button>
    </div>
  </header>

  <!-- Start page -->
  <main class="start" id="start">
    <div class="drag-strip"></div>
    <div class="start-inner">
      <img src="pennywise.svg" class="logo" alt="">
      <h1>Pennywise</h1>
      <p class="sub">A browser that floats. Flip any stream to Focus for just the video.</p>
      <form id="start-form" autocomplete="off">
        <input id="start-input" type="text" spellcheck="false" placeholder="Paste a Twitch or YouTube link, or search">
      </form>
      <div class="chips">
        <button class="chip" data-url="https://www.twitch.tv/">Twitch</button>
        <button class="chip" data-url="https://www.youtube.com/">YouTube</button>
      </div>
      <div class="recent" id="recent"></div>
      <p class="hint"><kbd>⇧⌘F</kbd> focus · <kbd>⇧⌘K</kbd> chat · <kbd>⌘L</kbd> address · <kbd>⇧⌘D</kbd> click-through</p>
    </div>
  </main>

  <div class="toast" id="toast"></div>
  <script src="bar.js"></script>
</body>
</html>
